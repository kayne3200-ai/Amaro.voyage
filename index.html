<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carnet Mobile — Spck</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <p class="eyebrow">Application HTML · CSS · JS</p>
      <h1>Mes Priorités du Jour</h1>
      <div class="stats-row">
        <span id="summary-text">0 sur 0 terminée</span>
        <span class="dot">·</span>
        <button id="clear-done" type="button" class="text-btn">Nettoyer terminées</button>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div id="progress-bar" class="progress-fill"></div>
      </div>
    </header>

    <form id="task-form" class="composer" autocomplete="off">
      <input
        id="task-input"
        type="text"
        placeholder="Ajouter une tâche (ex: Tester dans Spck Editor)..."
        required
      />
      <button type="submit">Ajouter</button>
    </form>

    <div class="filter-bar" role="tablist" aria-label="Filtrer les tâches">
      <button type="button" class="filter-btn active" data-filter="all">Toutes</button>
      <button type="button" class="filter-btn" data-filter="active">En cours</button>
      <button type="button" class="filter-btn" data-filter="done">Terminées</button>
    </div>

    <ul id="task-list" class="task-list"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
